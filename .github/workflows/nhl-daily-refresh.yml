# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: NHL Daily (Ingest → Refresh → Score → Export)

on:
  workflow_dispatch:
    inputs:
      debug_pbp:
        description: "Set DEBUG_PBP (0/1)"
        type: choice
        options: ["0", "1"]
        default: "0"
        required: false
  schedule:
    # All times are in UTC. Comments show EST/EDT and PST/PDT for convenience.

    - cron: "30 12 * * *" # Morning seed → 07:30 EST / 08:30 EDT • 04:30 PST / 05:30 PDT
    - cron: "30 20 * * *" # Midday refresh → 15:30 EST / 16:30 EDT • 12:30 PST / 13:30 PDT
    - cron: "45 00 * * *" # Pre-puck check → 19:45 EST / 20:45 EDT • 16:45 PST / 17:45 PDT
    - cron: "30 07 * * *" # PST final sweep → 23:30 PST (prev day) / 00:30 PDT • 02:30 EST / 03:30 EDT

concurrency:
  group: nhl-daily
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: UTC
      DEBUG_PBP: ${{ github.event.inputs.debug_pbp || '0' }}
      PSYCOPG_DISABLE_PREPARES: "1"

    steps:
      # -------------------- Checkout & models --------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch LFS models & verify
        run: |
          git lfs pull
          ls -lh backend/nhl/models/latest || true
          ls -lh backend/nhl/models/latest/shots_on_goal || true
          ls -lh backend/nhl/models/latest/goalie_saves || true

      # -------------------- Dates (ET) --------------------
      - name: Set dates (ET)
        id: dates
        run: |
          SLATE_DATE=$(TZ=America/New_York date +%F)
          YDAY=$(TZ=America/New_York date -d 'yesterday' +%F)
          echo "SLATE_DATE=$SLATE_DATE" >> $GITHUB_ENV
          echo "YDAY=$YDAY" >> $GITHUB_ENV
          echo "slate_date=$SLATE_DATE" >> $GITHUB_OUTPUT
          echo "yday=$YDAY" >> $GITHUB_OUTPUT
          echo "SLATE_DATE=${SLATE_DATE} YDAY=${YDAY}"

      # -------------------- Tooling --------------------
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check DB connectivity
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT now();"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (scripts only)
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/nhl/training/requirements.txt ]; then
            python -m pip install -r backend/nhl/training/requirements.txt
          fi
          python -m pip install "psycopg[binary]>=3.1" "requests>=2.31" python-dotenv

      # -------------------- Helpers: retry + timeout guards --------------------
      - name: Define retry & timeout helpers
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/retry.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          CMD="$*"
          : "${RETRY_TIMEOUT:=600}"
          : "${RETRY_KILL_GRACE:=30}"
          trap 'jobs -rp | xargs -r kill -9 || true' EXIT
          for n in 1 2 3; do
            echo "→ Attempt $n: $CMD"
            if timeout --preserve-status -k "${RETRY_KILL_GRACE}s" "${RETRY_TIMEOUT}s" \
                 stdbuf -oL -eL bash -lc "$CMD"; then   # <-- changed: stdbuf wraps inner bash
              exit 0
            fi
            echo "Attempt $n failed; sleeping $((n*10))s..."
            sleep $((n*10))
          done
          echo "All attempts failed."
          exit 1
          EOF
          chmod +x /tmp/retry.sh

          cat > /tmp/guard.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          CMD="$1"; shift || true
          TO="${1:-600}"
          trap 'jobs -rp | xargs -r kill -9 || true' EXIT
          timeout --preserve-status -k 30s "${TO}s" stdbuf -oL -eL bash -lc "$CMD"   # <-- same change
          EOF
          chmod +x /tmp/guard.sh

      # -------------------- Ingest (schedule + rosters) --------------------
      - name: Import today's schedule (API → nhl.games)
        env:
          SLATE_DATE: ${{ env.SLATE_DATE }}
        run: /tmp/retry.sh "python backend/nhl/scripts/import_schedule_today.py"

      - name: Check slate
        id: slate
        run: |
          set -euo pipefail
          HAS=$(psql "$SUPABASE_DB_URL" -Atq -c "select exists (select 1 from nhl.games where game_date = DATE '$SLATE_DATE')")
          echo "has_games=$HAS" >> "$GITHUB_OUTPUT"
          echo "has_games=${HAS}"

      - name: Import today's rosters (API → nhl.roster_status)
        if: steps.slate.outputs.has_games == 't'
        env:
          SLATE_DATE: ${{ env.SLATE_DATE }}
          SKIP_ROSTER_STATUS: "1"
          SKIP_PLAYERS: "1"
        run: /tmp/retry.sh "python backend/nhl/scripts/import_roster_today.py"

      # -------------------- Schema / features refresh --------------------
      - name: Refresh features/views (align contract)
        if: steps.slate.outputs.has_games == 't'
        run: |
          set -e
          if [ -f backend/nhl/scripts/refresh.sql ]; then
            echo "Running backend/nhl/scripts/refresh.sql …"
            export PGOPTIONS='-c statement_timeout=0'
            /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -f backend/nhl/scripts/refresh.sql"
          else
            echo "No refresh.sql found — skipping."
          fi

      # -------------------- Pre-slate seed (tomorrow, ET) --------------------
      - name: Pre-slate seed (tomorrow, ET)
        run: |
          set -euo pipefail
          TMRW=$(TZ=America/New_York date -d 'tomorrow' +%F)
          echo "Tomorrow (ET): ${TMRW}"

          # ensure schedule/rosters exist for tomorrow
          SLATE_DATE="${TMRW}" python backend/nhl/scripts/import_schedule_today.py || true
          SLATE_DATE="${TMRW}" SKIP_ROSTER_STATUS=1 python backend/nhl/scripts/import_roster_today.py || true

          # seed goalie & skater features for tomorrow
          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -v slate_date='${TMRW}' -f backend/nhl/sql/seed_goalie_features_for_slate.sql" || true
          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -v slate_date='${TMRW}' -f backend/nhl/sql/seed_sog_features_for_slate.sql" || true

          # refresh READY so v_slate_* can see any newly seeded rows
          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -f backend/nhl/scripts/refresh.sql"

      - name: Refresh players & roster (API → stage → upsert)
        if: steps.slate.outputs.has_games == 't'
        env:
          SLATE_DATE: ${{ env.SLATE_DATE }}
        run: /tmp/retry.sh "python backend/nhl/scripts/refresh_players_and_roster_today.py"

      - name: Seed features for TODAY (ET)
        if: steps.slate.outputs.has_games == 't'
        run: |
          set -euo pipefail
          # Seed today’s skater & goalie features for the slate date
          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -v slate_date='$SLATE_DATE' -f backend/nhl/sql/seed_sog_features_for_slate.sql"
          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -v slate_date='$SLATE_DATE' -f backend/nhl/sql/seed_goalie_features_for_slate.sql"

          # Make sure views/materializations see the new rows
          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -f backend/nhl/scripts/refresh.sql"

          # (Optional) sanity: require non-zero rows so exports aren’t header-only
          SOG=$(psql "$SUPABASE_DB_URL" -Atqc "select count(*) from nhl.v_slate_sog_features where game_date = date '$SLATE_DATE';")
          SAV=$(psql "$SUPABASE_DB_URL" -Atqc "select count(*) from nhl.v_slate_saves_features where game_date = date '$SLATE_DATE';")
          echo "today counts → sog=${SOG} saves=${SAV}"
          test "${SOG}" -gt 0 && test "${SAV}" -gt 0

      # -------------------- Export (CSV) --------------------
      - name: Export slate CSVs (today only)
        if: steps.slate.outputs.has_games == 't'
        run: |
          set -euo pipefail
          export PGOPTIONS='-c statement_timeout=0'
          mkdir -p exports
          echo "SLATE_DATE=${SLATE_DATE}"

          /tmp/retry.sh "psql --no-psqlrc -q \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -v slate_date='$SLATE_DATE' -f backend/nhl/sql/export_sog.sql > exports/train_nhl_sog_v2.csv"
          /tmp/retry.sh "psql --no-psqlrc -q \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -v slate_date='$SLATE_DATE' -f backend/nhl/sql/export_saves.sql > exports/train_goalie_saves_v2.csv"

          echo "Exported:"
          wc -l exports/train_nhl_sog_v2.csv exports/train_goalie_saves_v2.csv || true
          head -n 3 exports/train_nhl_sog_v2.csv || true
          head -n 3 exports/train_goalie_saves_v2.csv || true

      - name: Validate CSV headers (must match scorer expectations)
        if: steps.slate.outputs.has_games == 't'
        run: |
          set -euo pipefail
          echo "== Header check =="
          for f in exports/train_nhl_sog_v2.csv exports/train_goalie_saves_v2.csv; do
            echo "$f:"
            head -n1 "$f" | tr ',' '\n' | nl -ba
          done

          /tmp/guard.sh "python - <<'PY'
          import csv, sys
          required = {'player_id','game_id','team_id','opponent_id','is_home','game_date'}
          for path in ('exports/train_nhl_sog_v2.csv','exports/train_goalie_saves_v2.csv'):
              with open(path, newline='') as f:
                  header = next(csv.reader(f), [])
              missing = required - set(header)
              if missing:
                  print(f'FATAL: {path} missing columns: {sorted(missing)}', file=sys.stderr)
                  sys.exit(2)
          print('Header validation OK')
          PY" 120

      - name: Inspect exports & metadata (before scoring)
        if: steps.slate.outputs.has_games == 't'
        shell: bash
        run: |
          set -euo pipefail

          echo "== CSV headers & row counts =="
          for f in exports/train_nhl_sog_v2.csv exports/train_goalie_saves_v2.csv; do
            echo "$f:"
            head -n1 "$f" | tr ',' '\n' | nl -ba
            echo "rows: $(wc -l < "$f")"
            echo "------"
          done

          echo "== Feature metadata keys (from model indexes) =="
          sudo apt-get update >/dev/null || true
          sudo apt-get install -y jq >/dev/null || true

          for P in \
            backend/nhl/models/latest/shots_on_goal/MODEL_INDEX.json \
            backend/nhl/models/latest/goalie_saves/MODEL_INDEX.json
          do
            echo "== $P =="
            if [[ -f "$P" ]]; then
              /tmp/guard.sh "jq -r '
                def keys_from_index:
                  if   (.feature_registry|type) == \"object\" then (.feature_registry|keys)
                  elif (.features|type)         == \"array\"  then .features
                  elif (.feature_cols|type)     == \"array\"  then .feature_cols
                  else [] end;
                \"family: \(.family)\",
                \"feature_keys: \" + (keys_from_index | join(\", \"))
              ' \"$P\"" 60
            else
              echo "missing"
            fi
          done

      # -------------------- Score & load --------------------
      - name: Score & Load predictions
        if: steps.slate.outputs.has_games == 't'
        run: |
          /tmp/guard.sh "python backend/nhl/scripts/run_daily_slate.py \
            --project nhl \
            --sog-csv exports/train_nhl_sog_v2.csv \
            --saves-csv exports/train_goalie_saves_v2.csv \
            --db-url \"$SUPABASE_DB_URL\" \
            --scorer \"$GITHUB_WORKSPACE/backend/nhl/scripts/score_nhl_props.py\"" 1200

      - name: Attach player names to predictions
        if: steps.slate.outputs.has_games == 't'
        run: |
          /tmp/guard.sh "python backend/nhl/scripts/attach_names.py" 300
          head -n 3 backend/nhl/data/processed/sog_with_names.csv  || true
          head -n 3 backend/nhl/data/processed/saves_with_names.csv || true

      # -------------------- Sanity counts --------------------
      - name: Verify counts
        if: steps.slate.outputs.has_games == 't'
        run: |
          /tmp/guard.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -c \"
            WITH g AS (SELECT game_id FROM nhl.games WHERE game_date = '${SLATE_DATE}'::date)
            SELECT 'games_today'            AS which, COUNT(*) FROM nhl.games                 WHERE game_date = '${SLATE_DATE}'::date
            UNION ALL SELECT 'roster_rows_today', COUNT(*) FROM nhl.roster_status r           WHERE r.game_id IN (SELECT game_id FROM g)
            UNION ALL SELECT 'sog_stage',         COUNT(*) FROM nhl.predictions_sog_stage s   WHERE s.game_id IN (SELECT game_id FROM g)
            UNION ALL SELECT 'saves_stage',       COUNT(*) FROM nhl.predictions_saves_stage s WHERE s.game_id IN (SELECT game_id FROM g)
            UNION ALL SELECT 'predictions',       COUNT(*) FROM nhl.predictions p             WHERE p.game_id IN (SELECT game_id FROM g);
          \"" 120

      # -------------------- Finals sweep (yesterday) --------------------
      - name: Finals sweep (yesterday)
        run: |
          echo "Refreshing statuses for YDAY=${YDAY}"
          SLATE_DATE="${YDAY}" /tmp/retry.sh "python backend/nhl/scripts/import_schedule_today.py"
          if [ -f backend/nhl/scripts/refresh.sql ]; then
            echo "Refreshing views after finals sweep…"
            export PGOPTIONS='-c statement_timeout=0'
            /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -f backend/nhl/scripts/refresh.sql"
          fi

      # -------------------- Artifacts --------------------
      - name: Upload exported CSVs (artifact)
        if: steps.slate.outputs.has_games == 't'
        uses: actions/upload-artifact@v4
        with:
          name: nhl-exports-${{ steps.dates.outputs.slate_date }}
          path: |
            exports/train_nhl_sog_v2.csv
            exports/train_goalie_saves_v2.csv
          if-no-files-found: warn
          retention-days: 14

      # -------------------- Seed goalie logs (yesterday ET) --------------------
      - name: Seed goalie logs for yesterday (ET)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export SLATE_DATE=$(TZ=America/New_York date -d 'yesterday' +%F)
          /tmp/retry.sh "python backend/nhl/scripts/seed_goalie_logs_for_date.py"

      # -------------------- Refresh players & roster (yesterday ET) --------------------
      - name: Refresh players & roster for yesterday (ET)
        if: steps.slate.outputs.has_games == 't'
        env:
          SLATE_DATE: ${{ env.YDAY }}
        run: |
          /tmp/retry.sh "python backend/nhl/scripts/refresh_players_and_roster_today.py"

      # -------------------- Seed skater logs (yesterday ET) --------------------
      - name: Seed skater logs for yesterday (ET)
        if: steps.slate.outputs.has_games == 't'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PSYCOPG_DISABLE_PREPARES: "1"
        run: |
          set -euo pipefail
          echo "Seeding skater logs for YDAY=${YDAY}"
          if [ -f backend/nhl/scripts/seed_skater_logs_for_date.py ]; then
            /tmp/retry.sh "SLATE_DATE='${YDAY}' python backend/nhl/scripts/seed_skater_logs_for_date.py"
          elif [ -f backend/nhl/scripts/import_skater_logs_for_date.py ]; then
            /tmp/retry.sh "SLATE_DATE='${YDAY}' python backend/nhl/scripts/import_skater_logs_for_date.py"
          elif [ -f backend/nhl/scripts/import_skater_logs.py ]; then
            /tmp/retry.sh "SLATE_DATE='${YDAY}' python backend/nhl/scripts/import_skater_logs.py"
          else
            echo 'No skater logs import script found; skipping.'
          fi

      # -------------------- Promote skater logs (stage → raw) --------------------
      - name: Promote skater logs (stage → raw) for yesterday (ET)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          YDAY=$(python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          et = ZoneInfo("America/New_York")
          print((dt.datetime.now(et).date() - dt.timedelta(days=1)).isoformat())
          PY
          )
          echo "Promoting staged skater logs for ${YDAY}"

          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -c \"
          WITH src AS (
            SELECT DISTINCT
              s.player_id, s.game_id, s.game_date,
              s.shots_on_goal, s.shot_attempts, s.toi_minutes, s.pp_toi_minutes
            FROM nhl.import_skater_logs_stage s
            WHERE s.game_date = DATE '${YDAY}'
          ),
          rs AS (
            SELECT DISTINCT game_id, team_id, player_id
            FROM nhl.roster_status
            WHERE game_id IN (SELECT game_id FROM nhl.games WHERE game_date = DATE '${YDAY}')
          ),
          g AS (
            SELECT game_id, home_team_id, away_team_id
            FROM nhl.games
            WHERE game_date = DATE '${YDAY}'
          ),
          joined AS (
            SELECT
              src.player_id,
              src.game_id,
              rs.team_id,
              CASE
                WHEN rs.team_id = g.home_team_id THEN g.away_team_id
                WHEN rs.team_id = g.away_team_id THEN g.home_team_id
                ELSE NULL
              END AS opponent_id,
              (rs.team_id = g.home_team_id) AS is_home,
              src.game_date,
              src.shots_on_goal,
              src.shot_attempts,
              src.toi_minutes,
              src.pp_toi_minutes
            FROM src
            JOIN rs ON rs.game_id = src.game_id AND rs.player_id = src.player_id
            JOIN g  ON g.game_id  = src.game_id
          )
          INSERT INTO nhl.skater_game_logs_raw
            (player_id, game_id, team_id, opponent_id, is_home, game_date,
             shots_on_goal, shot_attempts, toi_minutes, pp_toi_minutes)
          SELECT
            player_id, game_id, team_id, opponent_id, is_home, game_date,
            shots_on_goal, shot_attempts, toi_minutes, pp_toi_minutes
          FROM joined
          WHERE opponent_id IS NOT NULL
          ON CONFLICT (player_id, game_id) DO UPDATE SET
            team_id        = EXCLUDED.team_id,
            opponent_id    = EXCLUDED.opponent_id,
            is_home        = EXCLUDED.is_home,
            game_date      = EXCLUDED.game_date,
            shots_on_goal  = EXCLUDED.shots_on_goal,
            shot_attempts  = COALESCE(EXCLUDED.shot_attempts, nhl.skater_game_logs_raw.shot_attempts),
            toi_minutes    = EXCLUDED.toi_minutes,
            pp_toi_minutes = EXCLUDED.pp_toi_minutes;
          \""

          /tmp/retry.sh "psql \"$SUPABASE_DB_URL\" -v ON_ERROR_STOP=1 -f backend/nhl/scripts/refresh.sql"

          psql "$SUPABASE_DB_URL" -F $'\t' -Atqc "
            SELECT 'stage_yday', COUNT(*) FROM nhl.import_skater_logs_stage WHERE game_date = DATE '${YDAY}'
            UNION ALL
            SELECT 'raw_yday',   COUNT(*) FROM nhl.skater_game_logs_raw   WHERE game_date = DATE '${YDAY}';
          "
