name: NHL Daily (Ingest → Refresh → Score → Export)

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: "Optional NHL gamePk to ingest"
        required: false
        default: ""
  schedule:
    - cron: "15 11 * * *" # ~07:15 ET (EDT) / 06:15 ET (EST)
    - cron: "15 5 * * *" # ~01:15 ET (EDT) / 00:15 ET (EST)

concurrency:
  group: nhl-daily
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/sports
      DEBUG_PBP: "0"
      PGSSLMODE: require
      TZ: UTC
      # secrets
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg[binary] python-dotenv

      # If a game_id is provided when dispatching, run only that one
      - name: Ingest single game (manual)
        if: ${{ github.event.inputs.game_id != '' }}
        run: python nhl/scripts/ingest_boxscore.py --game-id ${{ github.event.inputs.game_id }}

      # Otherwise, fetch today's schedule and ingest all games
      - name: Ingest today’s games
        if: ${{ github.event.inputs.game_id == '' }}
        run: |
          python - <<'PY'
          import requests, datetime as dt, os, sys
          today = dt.date.today().isoformat()
          url = f"https://api-web.nhle.com/v1/schedule/{today}"
          r = requests.get(url, timeout=20); r.raise_for_status()
          js = r.json()
          game_ids = []
          for bucket in js.get('gameWeek', []):
              for g in bucket.get('games', []):
                  gid = g.get('id') or g.get('gamePk') or g.get('gameId')
                  if gid: game_ids.append(int(gid))
          if not game_ids:
              print("No games found for", today); sys.exit(0)
          print("Ingesting:", game_ids)
          for gid in game_ids:
              rc = os.system(f"python nhl/scripts/ingest_boxscore.py --game-id {gid}")
              if rc != 0:
                  sys.exit(os.WEXITSTATUS(rc))
          PY
