# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: NHL Daily (Ingest → Refresh → Score → Export)

on:
  workflow_dispatch:
    inputs:
      debug_pbp:
        description: "Set DEBUG_PBP (0/1)"
        type: choice
        options: ["0", "1"]
        default: "0"
        required: false
  schedule:
    - cron: "15 11 * * *" # 04:15 PT / 07:15 ET
    - cron: "15 5 * * *" # 22:15 PT / 01:15 ET

concurrency:
  group: nhl-daily
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: UTC
      DEBUG_PBP: ${{ github.event.inputs.debug_pbp || '0' }}
      PSYCOPG_DISABLE_PREPARES: "1"

    steps:
      # -------------------- Checkout & models --------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch LFS models & verify
        run: |
          git lfs pull
          ls -lh backend/nhl/models/latest || true
          ls -lh backend/nhl/models/latest/shots_on_goal || true
          ls -lh backend/nhl/models/latest/goalie_saves || true

      # -------------------- Dates (ET) --------------------
      - name: Set dates (ET)
        id: dates
        run: |
          SLATE_DATE=$(TZ=America/New_York date +%F)
          YDAY=$(TZ=America/New_York date -d 'yesterday' +%F)
          echo "SLATE_DATE=$SLATE_DATE" >> $GITHUB_ENV
          echo "YDAY=$YDAY" >> $GITHUB_ENV
          echo "slate_date=$SLATE_DATE" >> $GITHUB_OUTPUT
          echo "yday=$YDAY" >> $GITHUB_OUTPUT
          echo "SLATE_DATE=${SLATE_DATE} YDAY=${YDAY}"

      # -------------------- Tooling --------------------
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check DB connectivity
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT now();"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps (scripts only)
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/nhl/training/requirements.txt ]; then
            python -m pip install -r backend/nhl/training/requirements.txt
          fi
          python -m pip install "psycopg[binary]>=3.1" "requests>=2.31" python-dotenv

      - name: Define retry helper
        shell: bash
        run: |
          cat > /tmp/retry.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          CMD="$*"
          s=1
          for n in 1 2 3; do
            echo "→ Attempt $n: $CMD"
            if bash -lc "$CMD"; then s=0; break; fi
            sleep $((n*10))
          done
          exit $s
          EOF
          chmod +x /tmp/retry.sh

      # -------------------- Ingest (schedule + rosters) --------------------
      - name: Import today's schedule (API → nhl.games)
        env:
          SLATE_DATE: ${{ env.SLATE_DATE }}
        run: /tmp/retry.sh "python backend/nhl/scripts/import_schedule_today.py"

      - name: Check slate
        id: slate
        run: |
          HAS=$(psql "$SUPABASE_DB_URL" -Atqc "select exists (select 1 from nhl.games where game_date='${SLATE_DATE}')")
          echo "has_games=$HAS" >> $GITHUB_OUTPUT
          echo "has_games=${HAS}"

      - name: Import today's rosters (API → nhl.roster_status)
        if: steps.slate.outputs.has_games == 't'
        env:
          SLATE_DATE: ${{ env.SLATE_DATE }}
        run: /tmp/retry.sh "python backend/nhl/scripts/import_roster_today.py"

      # -------------------- Schema / features refresh --------------------
      - name: Refresh features/views (align contract)
        if: steps.slate.outputs.has_games == 't'
        run: |
          set -e
          if [ -f backend/nhl/scripts/refresh.sql ]; then
            echo "Running backend/nhl/scripts/refresh.sql …"
            export PGOPTIONS='-c statement_timeout=0'
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f backend/nhl/scripts/refresh.sql
          else
            echo "No refresh.sql found — skipping."
          fi

      # -------------------- Export (CSV) --------------------
      - name: Export slate CSVs (today only)
        if: steps.slate.outputs.has_games == 't'
        run: |
          set -e
          export PGOPTIONS='-c statement_timeout=0'
          mkdir -p exports

          # Detect views created by refresh.sql (preferred export source)
          HAS_V_SOG=$(psql "$SUPABASE_DB_URL" -Atqc "select coalesce(to_regclass('nhl.v_slate_sog_features')::text,'')" | tr -d '\r\n')
          HAS_V_SAVES=$(psql "$SUPABASE_DB_URL" -Atqc "select coalesce(to_regclass('nhl.v_slate_saves_features')::text,'')" | tr -d '\r\n')
          echo "HAS_V_SOG=${HAS_V_SOG:-(none)}"
          echo "HAS_V_SAVES=${HAS_V_SAVES:-(none)}"

          # ---------- SOG export ----------
          if [ -n "$HAS_V_SOG" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v slate_date="$SLATE_DATE" -c "COPY (SELECT player_id, game_id, team_id, opponent_id, is_home, game_date, NULL::int AS shots_on_goal, d5_sog_per60, d10_sog_per60, d20_sog_per60, team_d10_sf_per_game, opp_d10_sf_allowed_per_game, role_pp_share, rest_days, b2b_flag, attempts_d10_per60, pace_index, opp_d10_sf_per60, team_d10_sa_per60, pace_matchup_index FROM nhl.v_slate_sog_features WHERE game_date = :'slate_date'::date ORDER BY game_id, player_id) TO STDOUT WITH CSV HEADER" > exports/train_nhl_sog_v2.csv
          else
            echo "v_slate_sog_features not found — using base table fallback."
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v slate_date="$SLATE_DATE" -c "COPY (SELECT player_id, game_id, team_id, opponent_id, is_home, game_date, NULL::int AS shots_on_goal, d5_sog_per60, d10_sog_per60, d20_sog_per60, team_d10_sf_per_game, opp_d10_sf_allowed_per_game, role_pp_share, rest_days, b2b_flag, attempts_d10_per60, pace_index, opp_d10_sf_per60, team_d10_sa_per60, pace_matchup_index FROM nhl.training_features_nhl_sog_v2 WHERE game_date = :'slate_date'::date ORDER BY game_id, player_id) TO STDOUT WITH CSV HEADER" > exports/train_nhl_sog_v2.csv
          fi

          # ---------- SAVES export ----------
          if [ -n "$HAS_V_SAVES" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v slate_date="$SLATE_DATE" -c "COPY (SELECT player_id, game_id, team_id, opponent_id, is_home, game_date, d10_shots_faced_per60, d10_save_pct, team_d10_sf_per_game, opp_d10_sf_allowed_per_game, pace_index, rest_days, b2b_flag, d5_saves_per60, d10_saves_per60, d5_shots_faced_per60, season_save_pct, opp_d10_sf_per60, team_d10_sa_per60, pace_matchup_index FROM nhl.v_slate_saves_features WHERE game_date = :'slate_date'::date ORDER BY game_id, player_id) TO STDOUT WITH CSV HEADER" > exports/train_goalie_saves_v2.csv
          else
            echo "v_slate_saves_features not found — using base table fallback."
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v slate_date="$SLATE_DATE" -c "COPY (SELECT player_id, game_id, team_id, opponent_id, is_home, game_date, d10_shots_faced_per60, d10_save_pct, team_d10_sf_per_game, opp_d10_sf_allowed_per_game, pace_index, rest_days, b2b_flag, d5_saves_per60, d10_saves_per60, d5_shots_faced_per60, season_save_pct, opp_d10_sf_per60, team_d10_sa_per60, pace_matchup_index FROM nhl.training_features_goalie_saves_v2 WHERE game_date = :'slate_date'::date ORDER BY game_id, player_id) TO STDOUT WITH CSV HEADER" > exports/train_goalie_saves_v2.csv
          fi

          echo "Exported:"
          ls -lh exports/

      # -------------------- Score & load --------------------
      - name: Score & Load predictions
        if: steps.slate.outputs.has_games == 't'
        run: |
          python backend/nhl/scripts/run_daily_slate.py \
            --project nhl \
            --sog-csv exports/train_nhl_sog_v2.csv \
            --saves-csv exports/train_goalie_saves_v2.csv \
            --db-url "$SUPABASE_DB_URL" \
            --scorer "$GITHUB_WORKSPACE/backend/nhl/scripts/score_nhl_props.py"

      # -------------------- Sanity counts --------------------
      - name: Verify counts
        if: steps.slate.outputs.has_games == 't'
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
            WITH g AS (SELECT game_id FROM nhl.games WHERE game_date = '${SLATE_DATE}'::date)
            SELECT 'games_today'            AS which, COUNT(*) FROM nhl.games                 WHERE game_date = '${SLATE_DATE}'::date
            UNION ALL SELECT 'roster_rows_today', COUNT(*) FROM nhl.roster_status r           WHERE r.game_id IN (SELECT game_id FROM g)
            UNION ALL SELECT 'sog_stage',         COUNT(*) FROM nhl.predictions_sog_stage s   WHERE s.game_id IN (SELECT game_id FROM g)
            UNION ALL SELECT 'saves_stage',       COUNT(*) FROM nhl.predictions_saves_stage s WHERE s.game_id IN (SELECT game_id FROM g)
            UNION ALL SELECT 'predictions',       COUNT(*) FROM nhl.predictions p             WHERE p.game_id IN (SELECT game_id FROM g);
          "

      # -------------------- Finals sweep (yesterday) --------------------
      - name: Finals sweep (yesterday)
        run: |
          echo "Refreshing statuses for YDAY=${YDAY}"
          SLATE_DATE="${YDAY}" /tmp/retry.sh "python backend/nhl/scripts/import_schedule_today.py"
          if [ -f backend/nhl/scripts/refresh.sql ]; then
            echo "Refreshing views after finals sweep…"
            export PGOPTIONS='-c statement_timeout=0'
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f backend/nhl/scripts/refresh.sql
          fi

      # -------------------- Artifacts --------------------
      - name: Upload exported CSVs (artifact)
        if: steps.slate.outputs.has_games == 't'
        uses: actions/upload-artifact@v4
        with:
          name: nhl-exports-${{ steps.dates.outputs.slate_date }}
          path: |
            exports/train_nhl_sog_v2.csv
            exports/train_goalie_saves_v2.csv
          if-no-files-found: warn
          retention-days: 14

      # -------------------- Seed goalie logs (yesterday ET) --------------------
      - name: Seed goalie logs for yesterday (ET)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export SLATE_DATE=$(TZ=America/New_York date -d 'yesterday' +%F)
          python backend/nhl/scripts/seed_goalie_logs_for_date.py
