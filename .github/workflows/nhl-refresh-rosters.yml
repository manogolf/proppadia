name: nhl-refresh-rosters

on:
  workflow_dispatch:
    inputs:
      nhl_roster_date:
        description: "Optional YYYY-MM-DD roster date override"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate DB secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "Missing required secret: SUPABASE_DB_URL"
            exit 1
          fi

      - name: Run full NHL roster refresh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NHL_ROSTER_DATE: ${{ github.event.inputs.nhl_roster_date || '' }}
        run: |
          if [ -n "$NHL_ROSTER_DATE" ]; then
            make nhl-roster-refresh-all NHL_ROSTER_DATE="$NHL_ROSTER_DATE"
          else
            make nhl-roster-refresh-all
          fi
