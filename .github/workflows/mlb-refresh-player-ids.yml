# .github/workflows/mlb-refresh-player-ids.yml
name: mlb-refresh-player-ids
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate DB secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "Missing required secret: SUPABASE_DB_URL"
            exit 1
          fi

      - name: Run full MLB roster refresh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MLB_ROSTER_DATE: ""
        run: |
          if [ -n "$MLB_ROSTER_DATE" ]; then
            make mlb-roster-refresh-all MLB_ROSTER_DATE="$MLB_ROSTER_DATE"
          else
            make mlb-roster-refresh-all
          fi
